server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 21m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Research-Gateway "";
    proxy_set_header X-Research-User "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"audio2midi-web"}';
    }

    location = /api {
        return 308 /api/$is_args$args;
    }

    # The account API routes start at /v1, not /api/v1.
    location /api/ {
        proxy_pass http://${ACCOUNT_API_UPSTREAM}/;
    }

    location ~ "^/r/[a-zA-Z0-9_-]{6,32}$" {
        limit_except GET { deny all; }
        proxy_pass http://${ACCOUNT_API_UPSTREAM};
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
