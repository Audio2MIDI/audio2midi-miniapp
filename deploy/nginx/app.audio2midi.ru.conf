server {
    listen 80;
    listen [::]:80;
    server_name app.audio2midi.ru miniapp.audio2midi.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.audio2midi.ru miniapp.audio2midi.ru;

    ssl_certificate /etc/letsencrypt/live/app.audio2midi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.audio2midi.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/app.audio2midi.ru.access.log;
    error_log /var/log/nginx/app.audio2midi.ru.error.log warn;

    root /opt/audio2midi-web/current;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"audio2midi-web"}';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8400/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Research-Gateway "";
        proxy_set_header X-Research-User "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 21m;
    }

    location ~ "^/r/[a-zA-Z0-9_-]{6,32}$" {
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 1k;
    }

    location ^~ /research/listening {
        auth_basic "Audio2MIDI Research";
        auth_basic_user_file /etc/nginx/audio2midi-research.htpasswd;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ^~ /research-api/ {
        auth_basic "Audio2MIDI Research";
        auth_basic_user_file /etc/nginx/audio2midi-research.htpasswd;
        proxy_pass http://127.0.0.1:8400/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Research-User $remote_user;
        include /etc/nginx/snippets/audio2midi-research-gateway.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
