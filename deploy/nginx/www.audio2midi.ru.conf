server {
    listen 80;
    listen [::]:80;
    server_name www.audio2midi.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://audio2midi.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.audio2midi.ru;

    ssl_certificate /etc/letsencrypt/live/www.audio2midi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.audio2midi.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://audio2midi.ru$request_uri;
}
