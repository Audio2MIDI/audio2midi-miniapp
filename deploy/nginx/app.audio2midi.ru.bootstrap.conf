server {
    listen 80;
    listen [::]:80;
    server_name app.audio2midi.ru miniapp.audio2midi.ru;

    access_log /var/log/nginx/app.audio2midi.ru.access.log;
    error_log /var/log/nginx/app.audio2midi.ru.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"audio2midi-web"}';
    }

    root /opt/audio2midi-web/current;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
