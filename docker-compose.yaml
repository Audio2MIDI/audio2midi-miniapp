services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:80"
    environment:
      ACCOUNT_API_UPSTREAM: ${ACCOUNT_API_UPSTREAM:-host.docker.internal:8400}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
